<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f97316" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>Full Range Lab — Move better. Train smarter.</title>
    <meta name="description" content="The all-in-one workspace for personal trainers and physiotherapists. Manage clients, build programs, track progress, and share a clean client portal — without the spreadsheet chaos." />

    <!-- Open Graph (WhatsApp, LinkedIn, Slack, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Full Range Lab" />
    <meta property="og:title" content="Full Range Lab — Move better. Train smarter." />
    <meta property="og:description" content="The all-in-one workspace for personal trainers and physiotherapists. Manage clients, build programs, track progress, and share a clean client portal." />
    <meta property="og:url" content="https://fullrangelab.com" />
    <meta property="og:image" content="https://fullrangelab.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Full Range Lab — Move better. Train smarter." />
    <meta name="twitter:description" content="The all-in-one workspace for personal trainers and physiotherapists." />
    <meta name="twitter:image" content="https://fullrangelab.com/og-image.png" />

    <link rel="canonical" href="https://fullrangelab.com" />
    <style>
      html, body { margin: 0; padding: 0; background: #ffffff; }
      @media (prefers-color-scheme: dark) { html, body { background: #030712; } }
      #app-boot {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: inherit;
      }
      #app-boot .spinner {
        width: 32px; height: 32px;
        border: 4px solid rgba(249, 115, 22, 0.2);
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-boot"><div class="spinner"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
