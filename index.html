<!doctype html>
<html lang="en">

    <link rel="canonical" href="https://fullrangelab.com" />

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Full Range Lab",
      "description": "The all-in-one workspace for personal trainers and physiotherapists. Manage clients, build programs, track progress, and share a clean client portal.",
      "url": "https://fullrangelab.com",
      "image": "https://fullrangelab.com/og-image.png",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "14-day free trial — no card required"
      }
    }
    </script>
    <style>
      html, body { margin: 0; padding: 0; background: #ffffff; }
      @media (prefers-color-scheme: dark) { html, body { background: #030712; } }
      #app-boot {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: inherit;
      }
      #app-boot .spinner {
        width: 32px; height: 32px;
        border: 4px solid rgba(249, 115, 22, 0.2);
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-boot"><div class="spinner"></div></div>
    <script type="module" src="/src/main.tsx"></script>
